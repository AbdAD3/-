<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الرسم الاحترافية بالرؤية الحاسوبية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات MediaPipe الرسمية والمستقرة -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --color-1: #00f3ff;
            --color-2: #ff007f;
            --color-3: #ffeb3b;
            --glass-bg: rgba(15, 22, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-glow: rgba(0, 243, 255, 0.2);
            --bg-dim: 0.35;
            --bg-blur: 0px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            overflow: hidden;
            background-color: #05070c;
            height: 100vh;
            width: 100vw;
            color: #f8fafc;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #05070c;
        }

        /* تحسين عرض فيديو الكاميرا لمنع الاقتطاع السيء */
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain; /* يضمن إظهار كامل محتوى الكاميرا بأبعادها الأصلية */
            transform: scaleX(-1);
            opacity: var(--bg-dim);
            filter: blur(var(--bg-blur));
            z-index: 1;
            transition: filter 0.3s ease, opacity 0.3s ease;
        }

        /* طبقة حماية إضافية للتحكم بالتعتيم المستمر */
        #dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, var(--dark-level, 0));
            z-index: 1;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            transform: scaleX(-1);
        }

        /* تصميم الـ Glassify الراقي والمستوحى من تصميمات محمود زاده */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                0 0 30px var(--neon-glow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* أشرطة الأدوات الذكية ذاتية الاختفاء */
        .toolbar {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            min-width: 550px;
            padding: 14px 28px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
        }

        #top-toolbar { top: -120px; }
        #bottom-toolbar { bottom: -120px; }

        .toolbar.visible { opacity: 1; }
        #top-toolbar.visible { top: 24px; }
        #bottom-toolbar.visible { bottom: 24px; }

        .info-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        /* تخصيص منتقي الألوان الفاخر */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .custom-color-input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .custom-color-input::-webkit-color-swatch {
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* شريط التحكم بالتعتيم والضبابية */
        .slider-control {
            width: 100px;
            accent-color: var(--color-1);
            cursor: pointer;
        }

        /* لوحة الـ HUD الدائرية المحسنة مع التغذية البصرية */
        #hud-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--color-1);
            pointer-events: none;
            z-index: 12;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 8, 16, 0.8);
            box-shadow: 0 0 25px var(--color-1);
        }

        #hud-text {
            font-size: 11px;
            font-weight: 800;
            text-align: center;
        }

        #hud-val {
            font-size: 14px;
            font-weight: 900;
            margin-top: 2px;
        }

        /* قائمة الإيموجي المنبثقة التفاعلية */
        #emoji-popup {
            position: absolute;
            z-index: 15;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            transform: scale(0);
            transform-origin: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
        }

        #emoji-popup.active {
            transform: scale(1);
        }

        .emoji-item {
            font-size: 26px;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .emoji-item:hover, .emoji-item.hover-active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="dark-overlay"></div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="paintCanvas"></canvas>

        <!-- لوحة الـ HUD الدائرية -->
        <div id="hud-ring">
            <span id="hud-text">جاهز</span>
            <span id="hud-val"></span>
        </div>

        <!-- قائمة الإيموجي المنبثقة -->
        <div id="emoji-popup" class="glass-panel">
            <div class="emoji-item" data-emoji="❤️" onclick="selectEmoji('❤️')">❤️</div>
            <div class="emoji-item" data-emoji="🔥" onclick="selectEmoji('🔥')">🔥</div>
            <div class="emoji-item" data-emoji="✨" onclick="selectEmoji('✨')">✨</div>
            <div class="emoji-item" data-emoji="🎉" onclick="selectEmoji('🎉')">🎉</div>
            <div class="emoji-item" data-emoji="🚀" onclick="selectEmoji('🚀')">🚀</div>
            <div class="emoji-item" data-emoji="👍" onclick="selectEmoji('👍')">👍</div>
            <div class="emoji-item" data-emoji="💡" onclick="selectEmoji('💡')">💡</div>
            <div class="emoji-item" data-emoji="🎨" onclick="selectEmoji('🎨')">🎨</div>
        </div>

        <!-- شريط الأدوات العلوي مع لوحات اختيار الألوان المخصصة -->
        <div id="top-toolbar" class="toolbar glass-panel">
            <div class="info-group">
                <span>الألوان المخصصة:</span>
                <div class="color-picker-wrapper">
                    <input type="color" id="picker-1" class="custom-color-input" value="#00f3ff" title="اللون الأول (الخنصر)">
                    <input type="color" id="picker-2" class="custom-color-input" value="#ff007f" title="اللون الثاني (الخنصر والبنصر)">
                    <input type="color" id="picker-3" class="custom-color-input" value="#ffeb3b" title="اللون الثالث (الخنصر والبنصر والوسطى)">
                </div>
            </div>
            <div class="info-group">
                <span>النمط النشط:</span>
                <span id="active-mode" class="status-badge">انتظار</span>
            </div>
        </div>

        <!-- شريط الأدوات السفلي مع أدوات التحكم بالخلفية -->
        <div id="bottom-toolbar" class="toolbar glass-panel">
            <div class="info-group">
                <span>الحجم:</span>
                <span id="brush-size-text" class="status-badge">12px</span>
            </div>
            <div class="info-group">
                <span>تعتيم الخلفية:</span>
                <input type="range" id="dim-slider" class="slider-control" min="0" max="1" step="0.1" value="0.6">
            </div>
            <div class="info-group">
                <span>الضبابية:</span>
                <input type="range" id="blur-slider" class="slider-control" min="0" max="20" step="1" value="0">
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('paintCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const hudRing = document.getElementById('hud-ring');
        const hudText = document.getElementById('hud-text');
        const hudVal = document.getElementById('hud-val');
        
        const topToolbar = document.getElementById('top-toolbar');
        const bottomToolbar = document.getElementById('bottom-toolbar');
        const emojiPopup = document.getElementById('emoji-popup');
        const darkOverlay = document.getElementById('dark-overlay');
        
        const activeModeText = document.getElementById('active-mode');
        const brushSizeText = document.getElementById('brush-size-text');

        // منتقيات الألوان المخصصة
        const colorPickers = {
            color1: document.getElementById('picker-1'),
            color2: document.getElementById('picker-2'),
            color3: document.getElementById('picker-3')
        };

        // منزلقات التحكم بالخلفية
        const dimSlider = document.getElementById('dim-slider');
        const blurSlider = document.getElementById('blur-slider');

        // متغيرات الحالة الأساسية للرسم
        let brushColor = colorPickers.color1.value;
        let brushSize = 12;
        let isDrawing = false;
        
        let lastX = 0;
        let lastY = 0;

        // حالة قائمة الإيموجي والتوقيت الزمني للإغلاق التلقائي
        let isEmojiMenuOpen = false;
        let selectedEmoji = '';
        let menuCooldown = false;
        let menuTimeout = null;

        // متغيرات قياس مدى حركة المسح العريضة لتلافي المسح العشوائي
        let xHistory = [];
        const sweepThreshold = 0.5; // يتطلب حركة واسعة تغطي 50% من عرض الكاميرا على الأقل

        // تحديث قيم الفلترة المطبقة على الكاميرا فوراً عند التغيير
        function applyCameraFilters() {
            const dimValue = parseFloat(dimSlider.value);
            const blurValue = parseInt(blurSlider.value);
            videoElement.style.opacity = (1 - dimValue).toFixed(2);
            videoElement.style.filter = `blur(${blurValue}px)`;
            darkOverlay.style.setProperty('--dark-level', dimValue);
        }
        dimSlider.addEventListener('input', applyCameraFilters);
        blurSlider.addEventListener('input', applyCameraFilters);
        applyCameraFilters(); // تشغيل أولي

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerHUD(text, val = "", color = "#00f3ff", scale = 1.1) {
            hudRing.style.borderColor = color;
            hudRing.style.boxShadow = `0 0 25px ${color}`;
            hudText.innerText = text;
            hudVal.innerText = val;
            hudRing.style.transform = `translate(-50%, -50%) scale(${scale})`;
            
            clearTimeout(hudRing.timeout);
            hudRing.timeout = setTimeout(() => {
                hudRing.style.transform = 'translate(-50%, -50%) scale(0)';
            }, 850);
        }

        function updateToolbarVisibility(y) {
            if (y < 0.16) topToolbar.classList.add('visible');
            else topToolbar.classList.remove('visible');

            if (y > 0.84) bottomToolbar.classList.add('visible');
            else bottomToolbar.classList.remove('visible');
        }

        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            triggerHUD("تم تجهيز", emoji, "#00f3ff", 1.2);
            closeEmojiMenu();
        }

        function closeEmojiMenu() {
            isEmojiMenuOpen = false;
            emojiPopup.classList.remove('active');
            clearTimeout(menuTimeout);
        }

        function resetMenuInactivityTimer() {
            clearTimeout(menuTimeout);
            menuTimeout = setTimeout(() => {
                if (isEmojiMenuOpen) {
                    closeEmojiMenu();
                    triggerHUD("تم الإغلاق", "تلقائياً", "#ff007f");
                }
            }, 5000); // 5 ثوانٍ من عدم التفاعل
        }

        // دالة فك رموز وتحديد اتجاه كف اليد (ظاهر اليد مقابل باطنها)
        function checkHandOrientation(landmarks, handedness) {
            // باستخدام حساب الضرب الاتجاهي (Cross Product) لمتجهين على مستوى الكف
            const v1 = { x: landmarks[5].x - landmarks[0].x, y: landmarks[5].y - landmarks[0].y };
            const v2 = { x: landmarks[17].x - landmarks[0].x, y: landmarks[17].y - landmarks[0].y };
            const crossProduct = v1.x * v2.y - v1.y * v2.x;

            // تحديد ما إذا كان ظاهر اليد هو المواجه للكاميرا
            return (handedness === "Right") ? (crossProduct < 0) : (crossProduct > 0);
        }

        function onResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                isDrawing = false;
                return;
            }

            const landmarks = results.multiHandLandmarks[0];
            const handedness = results.multiHandedness[0].label;
            
            const indexTip = landmarks[8];
            const screenX = indexTip.x * canvasElement.width;
            const screenY = indexTip.y * canvasElement.height;

            const clientX = (1 - indexTip.x) * window.innerWidth;
            const clientY = indexTip.y * window.innerHeight;

            // تتبع دائرة الـ HUD لإصبع السبابة
            hudRing.style.left = `${clientX}px`;
            hudRing.style.top = `${clientY}px`;

            if (isEmojiMenuOpen) {
                emojiPopup.style.left = `${clientX - 110}px`;
                emojiPopup.style.top = `${clientY - 140}px`;
                resetMenuInactivityTimer();
            }

            updateToolbarVisibility(indexTip.y);

            // استخلاص حالة تمدد الأصابع
            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringUp = landmarks[16].y < landmarks[14].y;
            const pinkyUp = landmarks[20].y < landmarks[18].y;
            const fingersSpread = Math.abs(landmarks[8].x - landmarks[20].x) > 0.13;

            // كشف اتجاه اليد (ظاهر اليد = true)
            const isBackOfHand = checkHandOrientation(landmarks, handedness);

            // -------------------------------------------------------------
            // 1. حركة فتح وإغلاق قائمة الإيموجي (🫰 بظاهر اليد حصراً)
            // -------------------------------------------------------------
            const distThumbIndex = Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y);
            const isHeartGesture = distThumbIndex < 0.035 && !middleUp && !ringUp && !pinkyUp;

            if (isHeartGesture && isBackOfHand && !menuCooldown) {
                menuCooldown = true;
                isEmojiMenuOpen = !isEmojiMenuOpen;
                if (isEmojiMenuOpen) {
                    emojiPopup.classList.add('active');
                    triggerHUD("قائمة الرموز", "مفتوحة 🫰", "#ff007f", 1.25);
                    resetMenuInactivityTimer();
                } else {
                    closeEmojiMenu();
                    triggerHUD("تم الإغلاق", "", "#ffffff");
                }
                setTimeout(() => { menuCooldown = false; }, 1200);
            }

            // تفعيل التحديد عبر التحليق (Hover) فوق عناصر الإيموجي
            if (isEmojiMenuOpen) {
                const hoverElements = document.querySelectorAll('.emoji-item');
                hoverElements.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (clientX >= rect.left && clientX <= rect.right &&
                        clientY >= rect.top && clientY <= rect.bottom) {
                        
                        if (!el.classList.contains('hover-active')) {
                            el.classList.add('hover-active');
                            // تحديد فوري عند المرور
                            el.hoverTimer = setTimeout(() => {
                                selectEmoji(el.getAttribute('data-emoji'));
                            }, 400); // تفعيل الاختيار بعد نصف ثانية من التثبيت الموضعي
                        }
                    } else {
                        el.classList.remove('hover-active');
                        clearTimeout(el.hoverTimer);
                    }
                });
            }

            // -------------------------------------------------------------
            // 2. التحكم في الحجم (الفرشاة أو الممحاة) عبر قبضة اليد أو الكف
            // -------------------------------------------------------------
            const isFist = !indexUp && !middleUp && !ringUp && !pinkyUp;
            const isFlatHand = indexUp && middleUp && ringUp && pinkyUp && fingersSpread;

            if (isFist) {
                if (brushSize > 4) {
                    brushSize -= 0.5;
                    const sizeLabel = `${Math.round(brushSize)}px`;
                    brushSizeText.innerText = sizeLabel;
                    triggerHUD("تصغير", sizeLabel, "#ffffff", 0.85);
                }
            } else if (isFlatHand && !isEmojiMenuOpen) {
                if (brushSize < 65) {
                    brushSize += 0.5;
                    const sizeLabel = `${Math.round(brushSize)}px`;
                    brushSizeText.innerText = sizeLabel;
                    triggerHUD("تكبير", sizeLabel, "#ffffff", 1.3);
                }
            }

            // -------------------------------------------------------------
            // 3. تفعيل الممحاة والمسح الشامل العريض
            // -------------------------------------------------------------
            const isEraserMode = indexUp && middleUp && ringUp && pinkyUp && !fingersSpread;

            if (isEraserMode) {
                activeModeText.innerText = "ممحاة";
                
                // حساب امتداد حركة المسح السريعة والواسعة جداً لمنع الخطأ
                xHistory.push(indexTip.x);
                if (xHistory.length > 25) xHistory.shift();
                
                const minX = Math.min(...xHistory);
                const maxX = Math.max(...xHistory);
                const sweepDistance = maxX - minX; // مدى الحركة الأفقية

                if (sweepDistance > sweepThreshold) {
                    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                    triggerHUD("مسح كامل اللوحة", "تم ✨", "#ff0000", 1.4);
                    xHistory = []; // تصفير مصفوفة الحركة
                } else {
                    canvasCtx.globalCompositeOperation = 'destination-out';
                    canvasCtx.beginPath();
                    canvasCtx.arc(screenX, screenY, brushSize * 2, 0, Math.PI * 2);
                    canvasCtx.fill();
                    triggerHUD("ممحاة", `${Math.round(brushSize)}px`, "#ffffff", 1.0);
                }
                isDrawing = false;
                return;
            }

            canvasCtx.globalCompositeOperation = 'source-over';

            // -------------------------------------------------------------
            // 4. تغيير الألوان المخصصة المربوطة بالأصابع المرفوعة
            // -------------------------------------------------------------
            if (!indexUp && !middleUp && !ringUp && pinkyUp) {
                brushColor = colorPickers.color1.value;
                triggerHUD("اللون النشط", "الأول", brushColor);
            } 
            else if (!indexUp && !middleUp && ringUp && pinkyUp) {
                brushColor = colorPickers.color2.value;
                triggerHUD("اللون النشط", "الثاني", brushColor);
            } 
            else if (!indexUp && middleUp && ringUp && pinkyUp) {
                brushColor = colorPickers.color3.value;
                triggerHUD("اللون النشط", "الثالث", brushColor);
            }

            // -------------------------------------------------------------
            // 5. ميكانيكية الكتابة الدقيقة ووضع قلم الرسم (✍)
            // -------------------------------------------------------------
            // المنطق الصارم: السبابة والابهام ملتصقان أو متقاربان كلياً، وبقية الأصابع منثنية
            const isHoldingPen = distThumbIndex < 0.04 && indexUp && !middleUp && !ringUp && !pinkyUp;

            if (isHoldingPen) {
                if (selectedEmoji !== '') {
                    // طباعة الرمز التعبيري لمرة واحدة
                    canvasCtx.save();
                    canvasCtx.translate(screenX, screenY);
                    canvasCtx.scale(-1, 1);
                    canvasCtx.font = `${brushSize * 3}px 'Cairo'`;
                    canvasCtx.textAlign = 'center';
                    canvasCtx.textBaseline = 'middle';
                    canvasCtx.fillText(selectedEmoji, 0, 0);
                    canvasCtx.restore();
                    
                    selectedEmoji = '';
                    triggerHUD("تم الطبع", "", "#00f3ff");
                } else {
                    activeModeText.innerText = "رسم بالقلم";
                    canvasCtx.strokeStyle = brushColor;
                    canvasCtx.lineWidth = brushSize;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.lineJoin = 'round';

                    if (!isDrawing) {
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(screenX, screenY);
                        isDrawing = true;
                    } else {
                        canvasCtx.lineTo(screenX, screenY);
                        canvasCtx.stroke();
                    }
                }
            } else {
                isDrawing = false;
                if (activeModeText.innerText === "رسم بالقلم") {
                    activeModeText.innerText = "انتظار";
                }
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.8,
            minTrackingConfidence: 0.8
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
